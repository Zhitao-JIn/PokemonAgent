name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install lint dependencies
        run: uv sync --frozen --python 3.11 --extra dev --group dev
      - name: ruff check
        run: uv run --frozen ruff check .
      - name: ruff format --check
        run: uv run --frozen ruff format --check .

  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install project dependencies
        run: uv sync --frozen --python 3.11 --extra dev --group dev
      - name: Check prompt boundary
        run: uv run --frozen python scripts/check_prompt_boundary.py
      - name: Check world self-contained boundary
        run: uv run --frozen python scripts/check_world_self_contained.py

  test:
    runs-on: ubuntu-latest
    env:
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed_cache
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/cache@v4
        with:
          path: ${{ env.FASTEMBED_CACHE_PATH }}
          key: ${{ runner.os }}-fastembed-${{ hashFiles('uv.lock') }}
      - name: Install test dependencies
        run: uv sync --frozen --python 3.11 --extra dev --extra reviewer --group dev
      - name: pytest
        run: uv run --frozen pytest

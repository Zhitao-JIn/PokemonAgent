[project]
name = "pokemon-agent"
version = "0.1.0"
description = "Harness-driven Pokemon agent — prototype"
# 3.11 而不是 3.10：agent-permission 用了 3.11 才有的 `enum.StrEnum`。
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "langgraph>=0.2",
    "fastembed>=0.8",
    "rank-bm25>=0.2",
    "agent-permission @ git+https://github.com/Zhitao-JIn/AgentPermission.git",
]
# fastembed：本地跑 embedding/reranker（ONNX runtime，不需要 torch），首次用某个模型时
# 会从 HuggingFace Hub 下一次权重、之后离线复用——这是"混合检索"（关键词 BM25 +
# 向量 + reranker 精排）里向量和精排两段用的库，见 memory/retrieval.py。
# rank-bm25：纯 Python 的 BM25 实现，混合检索里关键词那一段用它，不用再手写一遍。
# agent-permission：工具/大脑调用上的权限切面（@require_permission）。**之前一直没写进
# 依赖**，靠开发机上装过才跑得起来——干净环境 clone 下来 import 就炸。它还要求启动目录下
# 存在 config/context.json 与 config/permissions.json，见 harness/harness.py 的 @initialize。

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",  # CI 里 `pytest --cov` 要用到，本地跑测试不强制需要
    "ruff>=0.6",
    "httpx>=0.27",  # fastapi TestClient 的传输层
]
# API 层（pokemon_agent/api.py）：FastAPI 服务 + SSE 事件流。核心 agent 运行
# 不依赖它——只有要暴露 HTTP 面给前端时才需要（`pip install -e .[api]`）。
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

# **必须显式声明包范围**——不加这一段，setuptools 的 flat-layout 自动发现
# 会把仓库根目录下所有"看起来像包"的目录都当成候选（`log`/`web`/`assets`/
# `config`/`evaluation`/`trace_data` 全部命中），报 "Multiple top-level
# packages discovered" 直接拒绝构建。`pip install -e .` 在这次改动之前就没有
# 真的跑通过（那也是为什么 `evaluation/` 这类新目录一冒出来就把这个坑炸开了）。
# 只声明 `pokemon_agent`：这是唯一要被安装、被其他项目 import 的分发内容；
# `evaluation/`、`tests/` 不装包，靠 `[tool.pytest.ini_options]` 的
# `pythonpath = ["."]` 直接跑，不需要被 setuptools 发现。
[tool.setuptools.packages.find]
include = ["pokemon_agent*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
# ANN101/ANN102 已从 ruff 移除，无需 ignore
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
"evaluation/tests/*" = ["ANN"]

[tool.pytest.ini_options]
# `tests/`：pokemon_agent 包各模块的测试。`evaluation/tests/`：测评子系统
# 自己的测试（不依赖 pokemon_agent，见 evaluation/SPEC.md 目录约定一节）——
# 两个子系统平行，测试目录也平行，不混进同一棵 tests/ 树。
testpaths = ["tests", "evaluation/tests"]
addopts = "-q"
# 包没 pip install 进环境，把项目根塞进 sys.path，测试里才能 import pokemon_agent / evaluation。
pythonpath = ["."]

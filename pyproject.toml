[project]
name = "pokemon-agent"
version = "0.1.0"
description = "Harness-driven Pokemon agent — prototype"
# 3.11：`enum.StrEnum`（schemas/trace/domain/trace_kind.py 等）需要。
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "langgraph>=0.2",
    "fastembed>=0.8",
    "rank-bm25>=0.2",
]
# fastembed：本地跑 embedding/reranker（ONNX runtime，不需要 torch），首次用某个模型时
# 会从 HuggingFace Hub 下一次权重、之后离线复用——这是"混合检索"（关键词 BM25 +
# 向量 + reranker 精排）里向量和精排两段用的库，见 memory/retrieval.py。
# rank-bm25：纯 Python 的 BM25 实现，混合检索里关键词那一段用它，不用再手写一遍。
# agent-permission（工具/大脑调用上的权限切面）已整体移除接入——见 CHANGELOG.md
# 2026-09-10 相关条目；不再是依赖，也不再需要 config/context.json、
# config/permissions.json。

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",  # CI 里 `pytest --cov` 要用到，本地跑测试不强制需要
    "ruff>=0.6",
    "httpx>=0.27",  # fastapi TestClient 的传输层
]
# API 层（pokemon_agent/api.py）：FastAPI 服务 + SSE 事件流。核心 agent 运行
# 不依赖它——只有要暴露 HTTP 面给前端时才需要（`pip install -e .[api]`）。
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

# **必须显式声明包范围**——不加这一段，setuptools 的 flat-layout 自动发现
# 会把仓库根目录下所有"看起来像包"的目录都当成候选（`log`/`web`/`assets`/
# `trace_data` 全部命中），报 "Multiple top-level
# packages discovered" 直接拒绝构建。`pip install -e .` 曾经就没有
# 真的跑通过（那也是为什么前些年的独立子目录一冒出来就把这个坑炸开了）。
# 只声明 `pokemon_agent`：这是唯一要被安装、被其他项目 import 的分发内容；
# `tests/` 不装包，靠 `[tool.pytest.ini_options]` 的
# `pythonpath = ["."]` 直接跑，不需要被 setuptools 发现。
[tool.setuptools.packages.find]
include = ["pokemon_agent*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
# ANN101/ANN102 已从 ruff 移除，无需 ignore
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.pytest.ini_options]
# `tests/`：pokemon_agent 包各模块的测试。
testpaths = ["tests"]
addopts = "-q"
# 包没 pip install 进环境，把项目根塞进 sys.path，测试里才能 import pokemon_agent。
pythonpath = ["."]

[project]
name = "pokemon-agent"
version = "0.1.0"
description = "Harness-driven Pokemon agent — prototype"
# 3.11：`enum.StrEnum`（schemas/harness/domain/trace_kind.py 等）需要。
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=3.0",
    "fastembed>=0.8",
    "rank-bm25>=0.2",
    "numpy>=1.26",
    "websockets>=16.0",
    "langfuse>=4.7,<5",
    "inspect-ai==0.3.271",
    "pyboy>=2.7.0",
    "mcp>=1.0,<2",
]
# fastembed：本地跑 embedding/reranker（ONNX runtime，不需要 torch），首次用某个模型时
# 会从 HuggingFace Hub 下一次权重、之后离线复用——这是"混合检索"（关键词 BM25 +
# 向量 + reranker 精排）里向量和精排两段用的库，见 memory/retrieval.py。
# rank-bm25：纯 Python 的 BM25 实现，混合检索里关键词那一段用它，不用再手写一遍。
# websockets：run 侧 reviewer_link 与独立 reviewer 进程之间的单跳 WebSocket。
# langfuse：可选显式选择的自托管 trace backend（Python SDK v4 + Observations API v2）；
# LocalTrace 默认仍是 JSON 文件存储。
# agent-permission（工具/大脑调用上的权限切面）已整体移除接入——见 CHANGELOG.md
# 2026-09-10 相关条目；不再是依赖，也不再需要 config/context.json、
# config/permissions.json。

[project.optional-dependencies]
reviewer = ["pydantic-ai-slim[openai]==2.57.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",  # CI 里 `pytest --cov` 要用到，本地跑测试不强制需要
    "ruff>=0.6",
]

# **必须显式声明包范围**——不加这一段，setuptools 的 flat-layout 自动发现
# 会把仓库根目录下所有"看起来像包"的目录都当成候选（`log`/`web`/`assets`/
# `tracelog` 全部命中），报 "Multiple top-level
# packages discovered" 直接拒绝构建。`pip install -e .` 曾经就没有
# 真的跑通过（那也是为什么前些年的独立子目录一冒出来就把这个坑炸开了）。
# 只声明 `pokemon_agent`：这是唯一要被安装、被其他项目 import 的分发内容；
# `tests/` 不装包，靠 `[tool.pytest.ini_options]` 的
# `pythonpath = ["."]` 直接跑，不需要被 setuptools 发现。
[tool.setuptools.packages.find]
# evals 也在内：`inspect eval` 按文件路径加载 task 模块，sys.path 不含仓库根——
# 两个顶层包都必须 editable 装进 venv（334 的部署缺口）。
include = ["pokemon_agent*", "evals*"]

[tool.setuptools.package-data]
pokemon_agent = ["reviewer/seats/ai/prompts/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
# **markdown 不进 ruff 的范围**：`ruff format` 连 ```python 代码块里的代码一起重排，
# 而 `docs/experiences/**` 与 `docs/PLAN_*.md` 是**历史档**（只读资产，按仓库口径
# 不改写）——让 formatter 去动它们等于拿格式规则改写历史记录。这里一次挡掉所有
# `.md`；`ruff check` 本来就不看 markdown，所以 lint 侧零损失。
extend-exclude = ["*.md", "**/*.md", "langfuse", ".pytest_tmp*", ".worktrees"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
# ANN101/ANN102 已从 ruff 移除，无需 ignore
ignore = []

[tool.ruff.lint.isort]
# langfuse 是第三方 SDK（自托管 v4），不是本项目的包——固定判第三方，
# 不让 import 排序结果取决于仓库根目录碰巧有没有那个未跟踪的 langfuse/ 目录。
known-third-party = ["langfuse"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
# Langfuse 是第三方 SDK 边界：observation 的 input/output/metadata、client 注入口
# 天然是动态形状（封套本体才是本项目的契约，它有严格类型）。同 tests 豁免 ANN 的逻辑。
"pokemon_agent/trace/langfuse_trace.py" = ["ANN401"]
"pokemon_agent/trace/langfuse_support.py" = ["ANN401"]

[tool.pytest.ini_options]
# `tests/`：pokemon_agent 包各模块的测试。
testpaths = ["tests"]
# `--basetemp`：把 pytest 的 `tmp_path` 根从系统临时目录搬到**仓库内**的 `.pytest_tmp/`。
# 为什么必须搬：pytest 每轮会话开始都会 `rm_rf` 掉 `%TEMP%\pytest-of-<user>\pytest-<n-3>`
# （`make_numbered_dir_with_cleanup(keep=3)`），那是**工作区之外的删除**——在受限
# 沙箱里每一次都弹一次"需要删除权限"的授权框，跑一次测试扰一次。搬到工作区内后，
# 读写删都在放行范围内，弹窗消失。（删不掉的目录会被 pytest 改名成 `garbage-<uuid>`
# 留在原地，之前 TEMP 里堆了 40 多个就是这个症状。）
# 用点号开头：ruff 默认跳过隐藏目录，不会被静态检查扫到。该目录已在 .gitignore 里。
# 注意 `--basetemp` 的相对路径是**相对当前工作目录**解析的——从仓库根跑即落在仓库根。
addopts = "-q --basetemp=.pytest_tmp -m \"not slow\""
# 慢测试标记：整图 + 存档恢复，单个用例数十秒，默认跳过；用 `python -m pytest -m slow` 单独跑。
markers = [
    "slow: 整图 + 存档恢复，单个用例数十秒，默认跳过",
]
# 包没 pip install 进环境，把项目根塞进 sys.path，测试里才能 import pokemon_agent。
pythonpath = [".", "tests"]

[dependency-groups]
dev = [
    "deepeval>=4.2.8",
]

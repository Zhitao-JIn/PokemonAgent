[project]
name = "pokemon-agent"
version = "0.1.0"
description = "Harness-driven Pokemon agent — prototype"
# 3.11 而不是 3.10：agent-permission 用了 3.11 才有的 `enum.StrEnum`。
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "langgraph>=0.2",
    "fastembed>=0.8",
    "rank-bm25>=0.2",
    "agent-permission @ git+https://github.com/Zhitao-JIn/AgentPermission.git",
]
# fastembed：本地跑 embedding/reranker（ONNX runtime，不需要 torch），首次用某个模型时
# 会从 HuggingFace Hub 下一次权重、之后离线复用——这是"混合检索"（关键词 BM25 +
# 向量 + reranker 精排）里向量和精排两段用的库，见 memory/retrieval.py。
# rank-bm25：纯 Python 的 BM25 实现，混合检索里关键词那一段用它，不用再手写一遍。
# agent-permission：工具/大脑调用上的权限切面（@require_permission）。**之前一直没写进
# 依赖**，靠开发机上装过才跑得起来——干净环境 clone 下来 import 就炸。它还要求启动目录下
# 存在 config/context.json 与 config/permissions.json，见 harness/harness.py 的 @initialize。

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
# ANN101/ANN102 已从 ruff 移除，无需 ignore
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

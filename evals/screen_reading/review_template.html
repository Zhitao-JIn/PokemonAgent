<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>解码核对</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", "PingFang SC", sans-serif; background: #f4f4f6; color: #1a1a1a; }
  #app { display: flex; height: 100vh; }
  #sidebar { width: 300px; flex-shrink: 0; background: #fff; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
  #sidebar-head { padding: 10px 12px; border-bottom: 1px solid #eee; }
  #sidebar-head select, #sidebar-head button { width: 100%; margin-top: 6px; padding: 4px 6px; font-size: 13px; }
  #sidebar-stats { font-size: 12px; color: #666; margin-top: 6px; }
  #list { flex: 1; overflow-y: auto; }
  .row { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid #f0f0f0; cursor: pointer; font-size: 12px; }
  .row:hover { background: #f6f8ff; }
  .row.active { background: #e6edff; }
  .row img { width: 40px; height: 36px; image-rendering: pixelated; border: 1px solid #ccc; flex-shrink: 0; }
  .row .meta { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .tag { margin-left: auto; font-size: 11px; flex-shrink: 0; text-align: right; }
  .tag.both_ok { color: #1a7f37; }
  .tag.model_fixed { color: #1a7f37; font-weight: 600; }
  .tag.model_broke { color: #c62828; font-weight: 600; }
  .tag.both_wrong { color: #c62828; }
  .rv { display: block; font-size: 10px; color: #1a56cc; }
  #main { flex: 1; overflow-y: auto; padding: 20px 28px; }
  #main h2 { margin-top: 0; font-size: 16px; }
  #summary-btn { padding: 8px 12px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 13px; background: #eef3ff; font-weight: 600; }
  #summary-btn:hover { background: #e0eaff; }
  #summary-view .sumbox { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 16px 20px; max-width: 900px; }
  #summary-view .sumbox h4 { margin: 14px 0 6px; font-size: 13px; color: #1a56cc; }
  #summary-view .sumbox .acc-line { font-size: 12px; line-height: 1.9; }
  table.acc-table { border-collapse: collapse; font-size: 12px; width: 100%; max-width: 600px; }
  table.acc-table th, table.acc-table td { border: 1px solid #d5e0f7; padding: 3px 8px; text-align: left; }
  table.acc-table th { color: #1a56cc; background: #f6f8ff; white-space: nowrap; }
  #summary-view table.facts th, #summary-view table.facts td { border-color: #d5e0f7; }
  #summary-view table.facts th { color: #1a56cc; background: #f6f8ff; width: 120px; }
  .cols { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
  #frame-wrap { flex-shrink: 0; }
  #frame-wrap img { width: 320px; height: 288px; image-rendering: pixelated; border: 2px solid #333; display: block; }
  #frame-nav { margin-top: 8px; display: flex; gap: 8px; }
  #frame-nav button { flex: 1; padding: 6px; }
  #ram-panel { background: #fffbe6; border: 1px solid #f0e0a0; border-radius: 6px; padding: 10px 14px; font-size: 12px; line-height: 1.7; min-width: 300px; max-width: 460px; }
  #ram-panel h3 { margin: 0 0 6px; font-size: 13px; }
  pre.grid { margin: 0; font-family: "SF Mono", Consolas, monospace; font-size: 12px; line-height: 1.25; background: #fff; border: 1px solid #eee0b0; padding: 6px; }
  table.facts { border-collapse: collapse; font-size: 12px; width: 100%; }
  table.facts th, table.facts td { border: 1px solid #eee0b0; padding: 3px 6px; text-align: left; vertical-align: top; }
  table.facts th { color: #8a6d00; white-space: nowrap; width: 130px; background: #fffdf2; }
  #compare-panel { flex: 1; min-width: 520px; background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 14px 18px; }
  #compare-panel h3 { margin: 0 0 8px; font-size: 13px; }
  table.fields { border-collapse: collapse; font-size: 12px; width: 100%; }
  table.fields th, table.fields td { border: 1px solid #ddd; padding: 3px 6px; text-align: left; vertical-align: top; }
  table.fields th { color: #1a56cc; white-space: nowrap; background: #f6f8ff; }
  table.compare-table tr:first-child th:first-child { width: 150px; }
  tr.match td { color: #1a7f37; }
  tr.mismatch td { color: #c62828; background: #fff5f5; }
  .note { font-size: 12px; color: #555; margin: 8px 0 0; line-height: 1.6; }
  #review { margin-top: 14px; border-top: 1px dashed #ccc; padding-top: 10px; font-size: 12px; }
  #review button { padding: 4px 12px; margin-right: 6px; }
  #review button.on { background: #1a56cc; color: #fff; border-color: #1a56cc; }
  #review textarea { width: 100%; height: 60px; margin-top: 6px; font-size: 12px; }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="sidebar-head">
      <select id="filter-status">
        <option value="all">全部</option>
        <option value="not_ok">有错（后三类）</option>
        <option value="model_fixed">🟢 模型补对</option>
        <option value="model_broke">🔴 模型改错</option>
        <option value="both_wrong">❌ 都错</option>
        <option value="both_ok">✅ 都对</option>
      </select>
      <select id="filter-cat"><option value="all">全部界面桶</option></select>
      <select id="filter-source">
        <option value="all">全部来源</option>
        <option value="observation_check">observation_check</option>
        <option value="probe_0926">probe_0926</option>
      </select>
      <button onclick="exportReview()">导出校对（JSON）</button>
      <div id="sidebar-stats"></div>
    </div>
    <div id="summary-btn" onclick="showSummary()">📋 总结</div>
    <div id="list"></div>
  </div>
  <div id="main">
    <h2 id="title">选一帧开始核对</h2>
    <div id="summary-view" style="display:none;"></div>
    <div id="record-view" style="display:none;">
      <div class="cols">
        <div id="frame-wrap">
          <img id="frame-img" src="">
          <div id="frame-nav">
            <button onclick="stepFrame(-1)">&larr; 上一帧</button>
            <button onclick="stepFrame(1)">下一帧 &rarr;</button>
          </div>
        </div>
        <div id="ram-panel"></div>
        <div id="compare-panel">
          <h3>逐字段比对：标注 / 解码直出 / 模型读后</h3>
          <div id="cmp"></div>
          <div id="review">
            <b>你的校对（针对"标注"一列）：</b>
            界面种类 <select id="rv-scene" onchange="setScene(this.value)"></select>
            初态 <select id="rv-start" onchange="setStart(this.value)"><option value="">—（常规场合）</option><option value="true">是</option><option value="false">否</option></select>
            <button id="rv-ok" onclick="setVerdict('ok')">同意</button>
            <button id="rv-bad" onclick="setVerdict('wrong')">有误</button>
            <textarea id="rv-note" placeholder="标注哪里不对、应该是什么；或这帧是口径问题" oninput="setNote(this.value)"></textarea>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script id="data">const DATA = __DATA_JSON__;</script>
<script>
let RECORDS = DATA.records;
let CUR = null;
const KEY = "screen_review_" + document.title;
let REVIEW = {};
try { REVIEW = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { REVIEW = {}; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(REVIEW)); } catch (e) {} }

function showSummary() {
  CUR = null; renderList();
  document.getElementById("title").textContent = "总结";
  document.getElementById("summary-view").innerHTML = DATA.summary;
  document.getElementById("summary-view").style.display = "";
  document.getElementById("record-view").style.display = "none";
}
function visible() {
  const fs = document.getElementById("filter-status").value, fc = document.getElementById("filter-cat").value,
        fr = document.getElementById("filter-source").value;
  return RECORDS.filter(r => (fs === "all" || r.status === fs || (fs === "not_ok" && r.status !== "both_ok"))
    && (fc === "all" || r.cat === fc) && (fr === "all" || r.source === fr));
}
(function buildCatFilter() {
  const sel = document.getElementById("filter-cat");
  [...new Set(RECORDS.map(r => r.cat))].sort().forEach(c => {
    const o = document.createElement("option"); o.value = c; o.textContent = c; sel.appendChild(o);
  });
})();
function rvMark(id) {
  const v = REVIEW[id];
  if (!v || !v.verdict) return "";
  return `<span class="rv">${v.verdict === "ok" ? "已同意" : "标了有误"}</span>`;
}
function renderList() {
  const vis = visible();
  document.getElementById("list").innerHTML = vis.map(r => `
    <div class="row ${r.seq === CUR ? 'active' : ''}" onclick="selectSeq(${r.seq})">
      <img src="${r.frame}">
      <div class="meta">${r.seq}. ${r.id}</div>
      <div class="tag ${r.status}">${r.tag}${rvMark(r.id)}</div>
    </div>`).join("");
  const done = RECORDS.filter(r => REVIEW[r.id] && REVIEW[r.id].verdict).length;
  const by = s => RECORDS.filter(r => r.status === s).length;
  document.getElementById("sidebar-stats").textContent =
    `共 ${RECORDS.length} 帧：都对 ${by('both_ok')} / 模型补对 ${by('model_fixed')} / 模型改错 ${by('model_broke')} / 都错 ${by('both_wrong')}；已校对 ${done}（当前筛选 ${vis.length}）`;
}
document.getElementById("filter-status").addEventListener("change", renderList);
document.getElementById("filter-cat").addEventListener("change", renderList);
document.getElementById("filter-source").addEventListener("change", renderList);
function stepFrame(d) { const v = visible(); const i = v.findIndex(r => r.seq === CUR); if (v[i + d]) selectSeq(v[i + d].seq); }
function selectSeq(seq) {
  CUR = seq; renderList();
  const r = RECORDS.find(x => x.seq === seq);
  document.getElementById("title").textContent = `${r.seq}. ${r.id}（${r.cat}）`;
  document.getElementById("summary-view").style.display = "none";
  document.getElementById("record-view").style.display = "";
  document.getElementById("frame-img").src = r.frame;
  document.getElementById("ram-panel").innerHTML = r.ram;
  document.getElementById("cmp").innerHTML = r.cmp;
  const v = REVIEW[r.id] || {};
  document.getElementById("rv-ok").className = v.verdict === "ok" ? "on" : "";
  document.getElementById("rv-bad").className = v.verdict === "wrong" ? "on" : "";
  document.getElementById("rv-note").value = v.note || "";
  document.getElementById("rv-scene").value = v.scene || r.label_scene || "";
  const st = ("at_start" in v) ? v.at_start : r.label_at_start;
  document.getElementById("rv-start").value = st === true ? "true" : st === false ? "false" : "";
}
function cur() { return RECORDS.find(x => x.seq === CUR); }
(function buildSceneSelect() {
  const sel = document.getElementById("rv-scene");
  (DATA.scenes || []).forEach(s => { const o = document.createElement("option"); o.value = s; o.textContent = s; sel.appendChild(o); });
})();
function setScene(v) { const r = cur(); if (!r) return; REVIEW[r.id] = Object.assign(REVIEW[r.id] || {}, {scene: v}); save(); renderList(); }
function setStart(v) { const r = cur(); if (!r) return; REVIEW[r.id] = Object.assign(REVIEW[r.id] || {}, {at_start: v === "" ? null : v === "true"}); save(); renderList(); }
function setVerdict(v) { const r = cur(); if (!r) return; REVIEW[r.id] = Object.assign(REVIEW[r.id] || {}, {verdict: v}); save(); selectSeq(CUR); }
function setNote(t) { const r = cur(); if (!r) return; REVIEW[r.id] = Object.assign(REVIEW[r.id] || {}, {note: t}); save(); }
function exportReview() {
  const blob = new Blob([JSON.stringify(REVIEW, null, 2)], {type: "application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "screen_review_result.json"; a.click();
}
showSummary();
</script>
</body>
</html>
